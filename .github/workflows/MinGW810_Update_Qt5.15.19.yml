name: MinGW810_Update_Qt5.15.19

#本文档中：Qt5采用mingw810_64或mingw810_32编译、小熊猫C++采用最新的mingw64或mingw32编译(均为MSVCRT)

on: workflow_dispatch
#on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        qt_version: ['5.15.19']
        qt_type: ['static']
        compiler_version: ["mingw810_1620_32", "mingw810_1620_64"]
        qt_rp: ["", "_RP"]

    steps:

    # 检出本仓库
    - name: Checkout repository
      uses: actions/checkout@v7

    # 检出RedPanda-CPP仓库
    - name: Checkout repository of RedPanda-CPP
      run: |
        cd ..  #Directory: D:\a\buildRedPanda-CPP
        git clone https://github.com/royqh1979/RedPanda-CPP.git

    # 安装 编译器和Qt库
    - name: Setup Compiler and Qt
      shell: pwsh
      run: |
        $qt_v="${{ matrix.qt_version }}"
        $qt_t="${{ matrix.qt_type }}"
        $co_v="${{ matrix.compiler_version }}"
        $qt_r="${{ matrix.qt_rp }}"

        cd ..  #Directory: D:\a\buildRedPanda-CPP

        if ($co_v -eq "mingw810_1620_32"){
          curl -L --fail --retry 3 --connect-timeout 30 -o i686-release-posix-dwarf-msvcrt.7z https://github.com/niXman/mingw-builds-binaries/releases/download/16.2.0-rt_v14-rev1/i686-16.2.0-release-posix-dwarf-msvcrt-rt_v14-rev1.7z
          7z x D:\a\buildRedPanda-CPP\i686-release-posix-dwarf-msvcrt.7z -oD:\a\buildRedPanda-CPP
        }
        elseif ($co_v -eq "mingw810_1620_64"){
          curl -L --fail --retry 3 --connect-timeout 30 -o x86_64-release-posix-seh-msvcrt.7z https://github.com/niXman/mingw-builds-binaries/releases/download/16.2.0-rt_v14-rev1/x86_64-16.2.0-release-posix-seh-msvcrt-rt_v14-rev1.7z
          7z x D:\a\buildRedPanda-CPP\x86_64-release-posix-seh-msvcrt.7z -oD:\a\buildRedPanda-CPP
        }
        else {
          Write-Host "ERROR: unknown compiler: $co_v"
          exit 1
        }

        # Qt库下载地址按命名约定拼接(buildQt 正式 release)
        # 契约: tag=Qt<版本>_rev0, 资产=Qt_<版本>-static-Release_<编译器代号>[_RP].7z
        # 资产不存在时 curl --fail 立即报错退出
        $co_v = $co_v -replace '^mingw810_1620_', 'mingw810_'
        $url = "https://github.com/yuanpeirong/buildQt/releases/download/Qt${qt_v}_rev0/Qt_${qt_v}-static-Release_${co_v}${qt_r}.7z"
        if (-not (Test-Path Qt.7z)) {
          curl -L --fail --retry 3 --connect-timeout 30 -o Qt.7z $url
          if ($LASTEXITCODE -ne 0) { Write-Host "ERROR: Qt package download failed: $url"; exit 1 }
        } else { Write-Host "cache hit: Qt.7z" }

        7z x D:\a\buildRedPanda-CPP\Qt.7z -oD:\a\buildRedPanda-CPP



    # 构建RedPanda-CPP(调用cmd编译脚本)
    - name: Build RedPanda-CPP with ${{ matrix.qt_version }}-${{ matrix.compiler_version }}${{ matrix.qt_rp }}
      shell: cmd
      run: |
        setlocal
        set QT_VERSION=${{ matrix.qt_version }}
        set QT_TYPE=${{ matrix.qt_type }}
        set COMPILER_VERSION=${{ matrix.compiler_version }}
        set QT_RP=${{ matrix.qt_rp }}
        call D:\a\buildRedPanda-CPP\buildRedPanda-CPP\build\MinGW64_Qt5.cmd %QT_VERSION% %QT_TYPE% %COMPILER_VERSION% %QT_RP%
        if errorlevel 1 exit /b 1

    # 打包
    - name: Package binaries
      run: |
        #ls     #D:\a\buildRedPanda-CPP\buildRedPanda-CPP(即仓库目录)
        7z a RedPanda-CPP-Qt${{ matrix.qt_version }}-${{ matrix.qt_type }}-${{ matrix.compiler_version }}${{ matrix.qt_rp }}.7z ../RedPanda-CPP-Qt${{ matrix.qt_version }}-${{ matrix.qt_type }}-${{ matrix.compiler_version }}${{ matrix.qt_rp }} -mx=9

    # 上传
    - uses: actions/upload-artifact@v7
      with:
        name: RedPanda-CPP-Qt${{ matrix.qt_version }}-${{ matrix.qt_type }}-${{ matrix.compiler_version }}${{ matrix.qt_rp }}
        path: RedPanda-CPP-Qt${{ matrix.qt_version }}-${{ matrix.qt_type }}-${{ matrix.compiler_version }}${{ matrix.qt_rp }}.7z


# =============================================================================
# 路径说明
# D:\a\buildRedPanda-CPP\buildRedPanda-CPP    当前目录即仓库目录
# D:\a\buildRedPanda-CPP                      上级目录，这里当做根目录
# D:\a\buildRedPanda-CPP\RedPanda-CPP         RedPanda-CPP源代码目录
# D:\a\buildRedPanda-CPP\mingw64              编译器目录
# D:\a\buildRedPanda-CPP\mingw32              编译器目录
# D:\a\buildRedPanda-CPP\6.12.0-static        Qt目录
# =============================================================================